<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Watch Ad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://adsgram.ai/js/adsgram.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0f1a;
  color:#fff;
  font-family:Arial;
}
.box{
  text-align:center;
}
.loader{
  margin-top:15px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="box">
  <h2>📺 Watching Ad</h2>
  <div class="loader">Please wait...</div>
</div>

<script>
const tg = Telegram.WebApp;
tg.ready(); tg.expand();

// 🔴 YOUR ADSGRAM BLOCK ID
const BLOCK_ID = 20338; // ← এখানে তোমার Adsgram Block ID বসাও

Adsgram.show({
  blockId: BLOCK_ID,

  onReward: () => {
    // ✅ Ad completed
    location.href = "index.html?ads=done";
  },

  onClose: () => {
    // ❌ Ad skipped
    tg.showAlert("❌ Ad not completed");
    location.href = "index.html";
  }
});
</script>

</body>
</html>
