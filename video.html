<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Watching Ad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Adsgram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0f1a;
  color:#fff;
  font-family:Arial;
}
.box{text-align:center}
</style>
</head>

<body>

<div class="box">
  <h2>📺 Watching Ad</h2>
  <p>Please wait...</p>
</div>

<script>
/* Telegram */
const tg = Telegram.WebApp;
tg.ready(); tg.expand();
const user = tg.initDataUnsafe.user;

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyBl0PIm4lvZea96Bte3KaKQJvurGE1P8Es",
  databaseURL: "https://post-c7e41-default-rtdb.firebaseio.com",
  projectId: "post-c7e41",
  appId: "1:758133068153:web:28ef27e45d8037e0d49fa8"
});

const db = firebase.database();
const userRef = db.ref("users/" + user.id);
const adminRef = db.ref("adminControl");

/* Load admin reward */
adminRef.once("value").then(snap=>{
  const ADMIN = snap.val();
  showAd(ADMIN.rewardPerAd);
});

/* Show Adsgram Ad */
function showAd(reward){
  const ad = new Adsgram({
    blockId: "20342" // 🔴 Adsgram block id
  });

  ad.show().then(result => {

    if(result.done){
      // ✅ Reward user
      userRef.transaction(u=>{
        if(!u) return u;
        u.balance += reward;
        u.dailyDone += 1;
        u.hourlyDone += 1;
        return u;
      });

      tg.showAlert("✅ Reward added");
    }

    // redirect back
    setTimeout(()=>{
      location.href = "index.html";
    },1000);

  }).catch(()=>{
    tg.showAlert("❌ Ad failed");
    location.href = "index.html";
  });
}
</script>

</body>
</html>
